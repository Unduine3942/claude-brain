name: CI

# windows-latest is the primary leg, not an afterthought. Everything specific
# to this tool is specific to Windows: the hook configuration uses pythonw.exe
# and forward-slashed absolute paths, the store lives in %LOCALAPPDATA%, and the
# CLI has to survive a cp1252 console. A Linux-only matrix would pass while the
# only platform it runs on was broken.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The platform this actually runs on, at both ends of the range
          # pyproject declares. Testing the declared floor is the point: a
          # `requires-python` nobody exercises is a guess.
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.13" }
          # Linux catches accidental Windows-only assumptions in the core,
          # which is meant to be portable even though the hooks are not.
          - { os: ubuntu-latest, python: "3.13" }

    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git history, so a shallow clone
          # with no tags produces the fallback version instead of the real one.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import without a path hack
        # The src layout means this exercises the INSTALLED package, so a
        # packaging mistake fails here rather than at a user's `pip install`.
        run: python -c "import claude_brain, claude_brain.cli; print(claude_brain.__version__)"

      - name: Package data is present
        # Both directories are read at runtime rather than imported, so they
        # are easy to leave out of the wheel and easy to not notice.
        run: |
          python -c "from claude_brain.db.migrations import runner; ms = runner.discover(); assert ms, 'no migrations shipped'; print(len(ms), 'migrations')"
          python -c "from claude_brain.config import VAULT_TEMPLATES_DIR as d; assert list(d.glob('*.md')), 'no vault templates shipped'; print(len(list(d.glob('*.md'))), 'templates')"

      - name: The console script works
        run: |
          brain --version
          brain --help

      - name: Test
        run: python -m pytest -q --cov --cov-report=term-missing

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip ruff
      # --fix is for development; CI must fail rather than quietly repair.
      - run: ruff check src tests hooks tools
      - run: ruff format --check src tests hooks tools

  secrets:
    name: no secrets in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip -e .
      - name: Scan the repo with the project's own scrubber
        run: python tools/scan_secrets.py
